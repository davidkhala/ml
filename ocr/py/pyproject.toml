[project]
name = "davidkhala.ml.ocr"
version = "0.0.2"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic", "davidkhala-utils"]

[project.optional-dependencies]
paddle = ["paddleocr", "paddlepaddle==3.2.*"]
paddle-ocr = ["paddlenlp; python_version < '3.12'", "pip"]
[tool.hatch.build.targets.sdist]
include = ["davidkhala"]

[tool.hatch.build.targets.wheel]
include = ["davidkhala"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest"
]